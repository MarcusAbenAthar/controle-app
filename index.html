<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Controle Diário</title>

<!-- PWA & Ícones -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Controle">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0f1115;color:#e8e8e8;padding:16px;max-width:480px;margin:auto}
h1{font-size:22px;margin-top:0}.sub{color:#9aa0a6;font-size:13px;margin-bottom:16px}
.card{background:#1a1d24;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #2a2e39}
label{font-size:12px;color:#9aa0a6;display:block;margin:10px 0 4px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2e39;background:#10131a;color:#fff;font-size:15px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:#2d7dff;color:#fff;font-weight:700;margin-top:14px;cursor:pointer}
.btn-sec{background:#1f232e;margin-top:8px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metric{background:#10131a;border-radius:12px;padding:12px;border:1px solid #2a2e39}
.metric b{display:block;font-size:10px;color:#9aa0a6}
.metric span{font-size:17px;font-weight:800}
.green span{color:#4ade80}.blue span{color:#60a5fa}.orange span{color:#fb923c}
table{width:100%;font-size:12px;border-collapse:collapse}
th{color:#9aa0a6;text-align:left;padding:8px 4px;border-bottom:1px solid #2a2e39}
td{padding:8px 4px;border-bottom:1px solid #1f232e}
.small{font-size:11px;color:#9aa0a6}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
<div id="auth-screen" class="card">
  <div style="display:flex; background:#10131a; padding:4px; border-radius:10px; margin-bottom:16px; border:1px solid #2a2e39;">
    <button id="tab-login" onclick="mudarModoAuth('login')" style="flex:1; padding:10px; border:0; border-radius:8px; background:#2d7dff; color:#fff; font-weight:bold; cursor:pointer;">Entrar</button>
    <button id="tab-signup" onclick="mudarModoAuth('signup')" style="flex:1; padding:10px; border:0; border-radius:8px; background:transparent; color:#9aa0a6; font-weight:bold; cursor:pointer;">Criar Conta</button>
  </div>

  <h1 id="auth-title">🔐 Entrar no Sistema</h1>
  <div class="sub" id="auth-sub">Informe seu e-mail e senha para acessar seus dados na nuvem.</div>

  <label>E-mail</label>
  <input type="email" id="email" placeholder="seu@email.com">

  <label>Senha</label>
  <input type="password" id="password" placeholder="Sua senha">

  <button class="btn" id="btn-auth-submit" onclick="executarAuth()">Entrar</button>

  <div id="auth-msg" class="small" style="margin-top:12px; text-align:center;"></div>
</div>

<!-- TELA DO APLICATIVO -->
<div id="app-screen" class="hidden">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>🚗 Controle Diário</h1>
    <button onclick="fazerLogout()" style="background:none;border:0;color:#ff8a8a;cursor:pointer;font-weight:bold;">Sair</button>
  </div>
  <div class="sub">Bruto • Combustível • Alimentação • KM • Nuvem</div>
  
  <div class="card">
    <label>Data</label><input type="date" id="data" onchange="verificarDataSelecionada()">
    <div class="row">
      <div><label>Valor Bruto R$</label><input type="number" id="bruto" placeholder="85"></div>
      <div><label>KM Rodado</label><input type="number" id="km" placeholder="120"></div>
    </div>
    <div class="row">
      <div><label>Combustível R$</label><input type="number" id="comb" placeholder="30"></div>
      <div><label>Alimentação R$</label><input type="number" id="alim" placeholder="15"></div>
    </div>
    <div class="row">
      <div><label>Outros R$</label><input type="number" id="outros" placeholder="0"></div>
      <div><label>Outros Apps/Bônus R$</label><input type="number" id="bonus" placeholder="0"></div>
    </div>
    <div class="metrics">
      <div class="metric blue"><b>R$ por KM Bruto</b><span id="m_bruto_km">R$ 0,00</span></div>
      <div class="metric green"><b>Líquido</b><span id="m_liquido">R$ 0,00</span></div>
      <div class="metric orange"><b>R$ por KM Líq</b><span id="m_liquido_km">R$ 0,00</span></div>
      <div class="metric"><b>Total Gasto</b><span id="m_gasto">R$ 0,00</span></div>
    </div>
    <button class="btn" id="btn-salvar" onclick="salvar()">Salvar dia</button>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <b>Histórico</b>
      <span class="small" id="totalAcum"></span>
    </div>
    <table>
      <thead><tr><th>Data</th><th>Bruto</th><th>Líq</th><th>R$/km</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <button class="btn btn-sec" onclick="exportar()">Exportar para o WhatsApp</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'Https://ectrvieffyfkbsttliwj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_aS4pis5Cve9JBPe7Nv-r1g_4XFZW8qe';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);$('data').valueAsDate = new Date();

let usuarioAtual = null;
let cacheDias = [];
let modoAuth = 'login';

// Registo otimizado de Service Worker inline para PWA no GitHub Pages
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('data:application/javascript,self.addEventListener("fetch",function(e){});');
}

function traduzirErro(mensagemOriginal) {
  if (!mensagemOriginal) return 'Ocorreu um erro inesperado. Tente novamente.';
  const msg = mensagemOriginal.toLowerCase();
  if (msg.includes('invalid login credentials')) return 'E-mail ou palavra-passe incorretos.';
  if (msg.includes('user already registered')) return 'Este e-mail já está registado. Alterne para a aba "Entrar".';
  if (msg.includes('password should be at least')) return 'A palavra-passe deve ter pelo menos 6 caracteres.';
  if (msg.includes('email not confirmed')) return 'E-mail ainda não confirmado. Verifique a sua caixa de entrada.';
  if (msg.includes('rate limit exceeded') || msg.includes('too many requests')) return 'Muitas tentativas. Aguarde alguns instantes.';
  if (msg.includes('invalid email')) return 'Por favor, insira um endereço de e-mail válido.';
  return 'Erro: ' + mensagemOriginal;
}

async function checarSessao() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    usuarioAtual = session.user;
    mostrarApp();
  } else {
    mostrarAuth();
  }
}
checarSessao();

function mostrarAuth() {
  $('auth-screen').classList.remove('hidden');$('app-screen').classList.add('hidden');
}

function mostrarApp() {
  $('auth-screen').classList.add('hidden');$('app-screen').classList.remove('hidden');
  carregarDados();
}

function mudarModoAuth(modo) {
  modoAuth = modo;
  const tabLogin = $('tab-login');
  const tabSignup = $('tab-signup');
  const title = $('auth-title');
  const sub = $('auth-sub');
  const btn = $('btn-auth-submit');
  const msg = $('auth-msg');

  msg.textContent = '';

  if (modo === 'login') {
    tabLogin.style.background = '#2d7dff';
    tabLogin.style.color = '#fff';
    tabSignup.style.background = 'transparent';
    tabSignup.style.color = '#9aa0a6';

    title.textContent = '🔐 Entrar no Sistema';
    sub.textContent = 'Informe seu e-mail e senha para acessar seus dados na nuvem.';
    btn.textContent = 'Entrar';
    btn.style.background = '#2d7dff';
    btn.style.color = '#fff';
  } else {
    tabSignup.style.background = '#2d7dff';
    tabSignup.style.color = '#fff';
    tabLogin.style.background = 'transparent';
    tabLogin.style.color = '#9aa0a6';

    title.textContent = '📝 Criar Nova Conta';
    sub.textContent = 'Crie sua conta para guardar seus ganhos e relatórios na nuvem.';
    btn.textContent = 'Criar Conta';
    btn.style.background = '#4ade80';
    btn.style.color = '#000';
  }
}

async function executarAuth() {
  const email = $('email').value.trim();
  const password = $('password').value;
  const msg = $('auth-msg');

  if (!email || !password) {
    msg.style.color = '#ff8a8a';
    msg.textContent = 'Por favor, preencha o e-mail e a palavra-passe.';
    return;
  }

  msg.style.color = '#60a5fa';
  msg.textContent = 'A carregar...';

  if (modoAuth === 'login') {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      msg.style.color = '#ff8a8a';
      msg.textContent = traduzirErro(error.message);
    } else {
      usuarioAtual = data.user;
      mostrarApp();
    }
  } else {
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) {
      msg.style.color = '#ff8a8a';
      msg.textContent = traduzirErro(error.message);
    } else {
      msg.style.color = '#4ade80';
      msg.textContent = 'Conta criada com sucesso! Já pode entrar com os seus dados.';
      mudarModoAuth('login');
    }
  }
}

async function fazerLogout() {
  await supabaseClient.auth.signOut();
  usuarioAtual = null;
  mostrarAuth();
}

function calc(){
  const bruto=parseFloat($('bruto').value)||0,
        km=parseFloat($('km').value)||0,
        comb=parseFloat($('comb').value)||0,
        alim=parseFloat($('alim').value)||0,
        outros=parseFloat($('outros').value)||0,
        bonus=parseFloat($('bonus').value)||0;
  const totalBruto = bruto + bonus;
  const gasto=comb+alim+outros,
        liquido=totalBruto-gasto,
        brutoKm=km>0?totalBruto/km:0,
        liquidoKm=km>0?liquido/km:0;
  $('m_bruto_km').textContent=brutoKm.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});$('m_liquido').textContent=liquido.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  $('m_liquido_km').textContent=liquidoKm.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});$('m_gasto').textContent=gasto.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  return{bruto:totalBruto,km,comb,alim,outros,bonus,gasto,liquido,brutoKm,liquidoKm}
}
['bruto','km','comb','alim','outros','bonus'].forEach(id=>$(id).addEventListener('input',calc));

// Função que verifica se já existe registo para a data e altera o botão para atualizar
function verificarDataSelecionada() {
  const dataVal = $('data').value;
  const diaExistente = cacheDias.find(d => d.data === dataVal);
  
  if (diaExistente) {
    $('bruto').value = diaExistente.bruto - (diaExistente.bonus \vert{}\vert{} 0);$('km').value = diaExistente.km;
    $('comb').value = diaExistente.comb;
    $('alim').value = diaExistente.alim;
    $('outros').value = diaExistente.outros;
    $('bonus').value = diaExistente.bonus || 0;
    $('btn-salvar').textContent = 'Atualizar este dia';$('btn-salvar').style.background = '#eab308';
    $('btn-salvar').style.color = '#000';
  } else {
    ['bruto','km','comb','alim','outros','bonus'].forEach(id=>$(id).value='');
    $('btn-salvar').textContent = 'Salvar dia';$('btn-salvar').style.background = '#2d7dff';
    $('btn-salvar').style.color = '#fff';
  }
  calc();
}

async function salvar(){
  const c=calc();
  if(!c.bruto){alert('Informe o valor bruto.');return}
  const dataVal=$('data').value||new Date().toISOString().slice(0,10);
  
  const diaExistente = cacheDias.find(d => d.data === dataVal);

  let error;
  if (diaExistente) {
    // Faz o UPDATE se o dia já existir
    const res = await supabaseClient
      .from('controle_dias')
      .update({
        bruto: c.bruto,
        km: c.km,
        comb: c.comb,
        alim: c.alim,
        outros: c.outros,
        bonus: c.bonus,
        gasto: c.gasto,
        liquido: c.liquido,
        bruto_km: c.brutoKm,
        liquido_km: c.liquidoKm
      })
      .eq('id', diaExistente.id)
      .eq('user_id', usuarioAtual.id);
    error = res.error;
  } else {
    // Faz o INSERT se for um dia novo
    const res = await supabaseClient
      .from('controle_dias')
      .insert([{
        user_id: usuarioAtual.id,
        data: dataVal,
        bruto: c.bruto,
        km: c.km,
        comb: c.comb,
        alim: c.alim,
        outros: c.outros,
        bonus: c.bonus,
        gasto: c.gasto,
        liquido: c.liquido,
        bruto_km: c.brutoKm,
        liquido_km: c.liquidoKm
      }]);
    error = res.error;
  }

  if(error) {
    alert('Erro ao guardar os dados: ' + traduzirErro(error.message));
    return;
  }

  ['bruto','km','comb','alim','outros','bonus'].forEach(id=>$(id).value='');
  $('btn-salvar').textContent = 'Salvar dia';$('btn-salvar').style.background = '#2d7dff';
  $('btn-salvar').style.color = '#fff';
  calc();
  carregarDados();
}

async function carregarDados() {
  const { data, error } = await supabaseClient
    .from('controle_dias')
    .select('*')
    .order('data', { ascending: false });

  if(error) {
    console.error('Erro ao carregar dados:', error);
    return;
  }

  cacheDias = data || [];
  render();
  verificarDataSelecionada();
}

function render(){
  const tbody=$('tbody');
  tbody.innerHTML='';
  let tLiq=0,tKm=0;
  cacheDias.forEach(d=>{
    tLiq+=d.liquido;
    tKm+=d.km;
    const tr=document.createElement('tr');
    const dataFmt = d.data.split('-').reverse().join('/');
    tr.innerHTML=`<td>${dataFmt.slice(0,5)}<br><span class=small>${d.km}km</span></td><td>R$ ${Number(d.bruto).toFixed(0)}</td><td style=color:#4ade80>R$ ${Number(d.liquido).toFixed(0)}</td><td>R$ ${Number(d.liquido_km).toFixed(2)}</td>`;
    tbody.appendChild(tr);
  });
  $('totalAcum').textContent=cacheDias.length?` Total líq R$ ${tLiq.toFixed(0)} em ${tKm}km` :'';
}

function exportar(){
  if(!cacheDias.length){alert('Nenhum dado para exportar.');return}
  let txt='*Controle Diário*\n\n';
  cacheDias.forEach(d=>{
    txt+=`📅 ${d.data} - Bruto R$${d.bruto} | Comb R$${d.comb} | Alim R$${d.alim} | Outros R$${d.outros} | Gasto R$${d.gasto} | Líq R$${Number(d.liquido).toFixed(2)} | ${d.km}km | R$/km R$${Number(d.liquido_km).toFixed(2)}\n`;
  });
  const totalLiq = cacheDias.reduce((a,b)=>a+Number(b.liquido),0);
  txt+=`\n💰 Total líquido: R$ ${totalLiq.toFixed(2)}`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}

calc();
</script>
</body>
</html>
